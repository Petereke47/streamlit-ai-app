services:
  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8501"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec streamlit run li2.py --server.headless true --server.address 0.0.0.0 --server.port 8501 --server.enableCORS false --server.enableXsrfProtection false"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
